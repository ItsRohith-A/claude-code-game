name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No lockfile in the repo on purpose: Claude Code would install its
      # packages for every user. package.json pins exact versions instead.
      - run: npm install
      - run: npm run build
      - name: dist/ is committed and up to date
        shell: bash
        run: git diff --exit-code -- dist
      - name: Tests
        shell: bash
        run: node --test test/*.test.js

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the plugin and marketplace manifests
        run: |
          npx -y @anthropic-ai/claude-code plugin validate --strict .claude-plugin/plugin.json
          npx -y @anthropic-ai/claude-code plugin validate --strict .
